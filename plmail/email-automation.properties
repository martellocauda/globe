# ============================================================================
# Configuración de DESARROLLO (apunta a los mocks WireMock del repo de infra)
# ============================================================================

# cron vacío = no se agenda; se dispara manual por REST /rest/ejecutar
cron=

# ----- Microsoft Graph -----
# Credenciales dummy: con graph_base_url seteado, MailReader entra en modo mock
# (token estático, no contacta Azure AD).
graph_tenant_id=00000000-0000-0000-0000-000000000000
graph_client_id=00000000-0000-0000-0000-000000000000
graph_client_secret=mock-secret
graph_user_email=casilla@btg.com

# Apunta al WireMock de Graph (modo mock). Vaciar en producción.
graph_base_url=http://graph-mock:8080/v1.0

# Carpeta y remitentes
mail_folders=inbox
sender=

# ----- Parser -----
tokens=Nombre del cliente, Celular del cliente, Mail, Cedula, Telefono del cual se contacto, Tipo de prestamo
separator=:
remove_tokens=<mailto:,mailto:,<mailto,mailto,
trim_values=true
remove_trailer_from=*********

# Marca como leído ante error de procesamiento (true/false)
on_error_mail_read=false

# ----- Web service SOAP (mock WireMock) -----
endpoint=http://soap-mock:8080/soap
tipo=LEAD
